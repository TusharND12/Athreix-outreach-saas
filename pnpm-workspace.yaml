packages:
  - .

allowBuilds:
  "@firebase/util": true
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

overrides:
  effect: 3.20.0
  postcss: 8.5.25
  "exceljs>uuid": 11.1.1
  "brace-expansion@<1.1.18": 1.1.18
  "brace-expansion@>=2.0.0 <2.1.4": 2.1.4
  "brace-expansion@>=4.0.0 <5.0.8": 5.0.9
  "ip-address@<=10.3.0": 10.3.1
  "nanoid@<3.3.17": 3.3.17
  "sharp@<0.35.0": 0.35.3
  "uuid@<11.1.1": 11.1.1

# Auth.js has not yet widened its Nodemailer peer range, but its mail transport
# API is compatible with the patched 9.x release used by this application.
peerDependencyRules:
  allowedVersions:
    nodemailer: ">=9.0.1"
