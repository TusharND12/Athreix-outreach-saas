services:
  worker:
    build: .
    command: ["node", "node_modules/tsx/dist/cli.mjs", "src/worker.ts"]
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      DEMO_MODE: "false"
      FIREBASE_PROJECT_ID: athreix-outreach-saas
      FIREBASE_STORAGE_BUCKET: athreix-outreach-saas.firebasestorage.app
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
      CRON_SECRET: local-compose-retention-secret-change-me
      SEARCH_TASK_SIGNING_SECRET: local-compose-search-task-signing-secret-change-me
      AUTH_SECRET: local-compose-auth-secret-at-least-32-characters
      FIELD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    volumes:
      - ./.athreix/firebase-admin.json:/run/secrets/firebase-admin.json:ro
