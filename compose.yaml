services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  worker:
    build: .
    command: ["pnpm", "worker"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      FIREBASE_PROJECT_ID: athreix-prospect-ai
      FIREBASE_STORAGE_BUCKET: athreix-prospect-ai.firebasestorage.app
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: local-compose-auth-secret-at-least-32-characters
      FIELD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    volumes:
      - ./.athreix/firebase-admin.json:/run/secrets/firebase-admin.json:ro
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
