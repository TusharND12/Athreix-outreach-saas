name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEMO_MODE: "true"
      AUTH_SECRET: ci-only-secret-at-least-thirty-two-characters
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/athreix_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/athreix_test?schema=public
      REDIS_URL: redis://localhost:6379
      FIELD_ENCRYPTION_KEY: Y2ktb25seS1rZXktMzItYnl0ZXMtbG9uZy0xMjM0NTY=
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: athreix_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm models:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm peers check
      - run: pnpm build
      - run: docker build --tag athreix-prospect-ai:ci .
      - run: docker run --rm --entrypoint sh athreix-prospect-ai:ci -c 'test -f src/worker.ts && test -f src/server/job-queue.ts && test -f src/lib/server/env.ts && test -f tsconfig.json'

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEMO_MODE: "true"
      NEXT_PUBLIC_DEMO_MODE: "false"
      AUTH_SECRET: ci-only-secret-at-least-thirty-two-characters
      FIELD_ENCRYPTION_KEY: Y2ktb25seS1rZXktMzItYnl0ZXMtbG9uZy0xMjM0NTY=
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
